<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're invited to Mahada</title>
</head>

<body
  style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;line-height:1.6;color:#000;max-width:600px;margin:0 auto;background:#fff;padding:0;">
  <div style="padding:40px 30px;">
    <div style="margin-bottom:30px;padding-bottom:30px;border-bottom:1px solid #e5e5e5;">
      <div style="display:flex;align-items:center;margin-bottom:20px;">
        <img src="{{inviter_avatar}}" alt="{{inviter_name}}"
          style="width:48px;height:48px;border-radius:50%;margin-right:15px;object-fit:cover;">
        <div>
          <h3 style="margin:0 0 4px;font-size:16px;font-weight:600;color:#000;">{{inviter_name}}</h3>
          <p style="margin:0;font-size:12px;color:#737373;">{{inviter_title}} ▸ {{inviter_institution}}</p>
        </div>
      </div>
      <p style="font-size:15px;color:#000;line-height:1.6;margin:20px 0;">{{body_text}}</p>
      {{custom_message_html}}
    </div>
    <div style="text-align:center;margin:40px 0;">
      <a href="{{cta_url}}"
        style="background:#fff;color:#000;padding:14px 32px;text-decoration:none;border-radius:8px;font-weight:600;display:inline-block;font-size:14px;border:2px solid #000;">
        {{cta_text}}
      </a>
    </div>
    <div
      style="margin-top:40px;padding-top:30px;border-top:1px solid #e5e5e5;text-align:center;color:#737373;font-size:12px;">
      <p>This invitation was sent by {{inviter_name}}</p>
      <p style="color:#a3a3a3;">If you didn't expect this, you can safely ignore this email.</p>
    </div>
  </div>
</body>

</html>
