<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Verification Code</title>
</head>

<body
  style="margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f5f5f5;">
  <table role="presentation" style="width:100%;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:40px 0;">
        <table role="presentation"
          style="width:600px;border-collapse:collapse;background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);">
          <tr>
            <td style="padding:40px 40px 20px;text-align:center;">
              <h1 style="margin:0;font-size:28px;font-weight:600;color:#000;">Mahada</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px;">
              <h2 style="margin:0 0 20px;font-size:24px;font-weight:600;color:#000;">Your Verification Code</h2>
              <p style="margin:0 0 20px;font-size:16px;line-height:24px;color:#666;">
                Use the code below to complete your registration:
              </p>
              <div
                style="background:#f8f9fa;border:2px solid #e9ecef;border-radius:8px;padding:30px;text-align:center;margin:30px 0;">
                <div
                  style="font-size:36px;font-weight:700;letter-spacing:8px;color:#000;font-family:'Courier New',monospace;">
                  {{otp}}
                </div>
              </div>
              <p style="margin:20px 0 0;font-size:14px;line-height:20px;color:#666;">
                This code expires in <strong>10 minutes</strong>. If you didn't request this, ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:30px 40px;border-top:1px solid #e9ecef;">
              <p style="margin:0;font-size:12px;color:#999;text-align:center;">
                This is an automated email from Mahada. Please do not reply.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
