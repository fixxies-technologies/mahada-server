[package]
name = "mahada-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["macros"] }
bcrypt = "0.19.0"
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.32"
jsonwebtoken = "10.3.0"
redis = { version = "1.1.0", features = [
  "tokio-comp",
  "aio",
  "streams",
  "connection-manager",
] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "uuid"] }
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tracing = "0.1.44"
uuid = { version = "1.23.0", features = ["serde", "v4", "v6"] }
